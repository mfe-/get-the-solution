<article>
    <h2 *ngIf="Category">{{ this.Category }}</h2>
    <ul *ngFor="let blogEntry of FiltertedBlogEntry" [attr.data-blogEntry-blogEntryId]="blogEntry.BlogEntryId">
        <li> {{blogEntry.Release | date : "yyyy.MM.dd"}}
            <a [href]="'/blog/' + blogEntry.Title"
            [title]="blogEntry.Title + ' ' + blogEntry.BlogEntryId"> {{blogEntry.Title}}</a>
        </li>
    </ul>
</article>
